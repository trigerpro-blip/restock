<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restock</title>
<meta name="theme-color" content="#EFF2EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Restock">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16211C; --ink-2:#4A5B52; --paper:#EFF2EA; --card:#FFFFFF; --line:#DCE2D6;
  --violet:#5B45D6; --violet-soft:#EDE9FD;
  --amber:#C97A06; --amber-soft:#FBEFD8;
  --green:#2E7D5B; --green-soft:#E1F0E7;
  --red:#B3261E; --red-soft:#FBE9E7;
  --blue:#2C6E8F; --blue-soft:#E1EEF4;
  --shadow:0 1px 0 rgba(22,33,28,.05), 0 6px 18px -12px rgba(22,33,28,.35);
  --r:14px;
  --display:"Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.35;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2.5px solid var(--violet);outline-offset:2px;border-radius:6px}
img{display:block}

.app{max-width:1200px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:rgba(239,242,234,.94);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 11px) 12px 9px}
.head-row{display:flex;align-items:center;gap:8px}
.wordmark{font-weight:700;letter-spacing:-.02em;font-size:19px;flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.wordmark i{font-style:normal;font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink-2);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-family:var(--mono);font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:9px;flex:none}
.sync:hover{background:#0000000a}
.icon-btn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:#0000000a}
.icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.addbtn{background:var(--violet);color:#fff;border-radius:11px;height:38px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;flex:none}
.addbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.dot.warn{background:var(--amber)} .dot.err{background:var(--red)} .dot.off{background:#B6C0B8}
.dot.busy{background:var(--violet);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

main{flex:1;padding:14px 12px 118px}
.cols{display:block}
.pane{display:none}
.pane.on{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.pane-title{display:none}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
.nav-inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;color:var(--ink-2);font-size:12px;font-weight:500}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--violet);background:var(--violet-soft)}
.tab .count{font-family:var(--mono);font-size:10px}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.empty{text-align:center;padding:34px 18px;color:var(--ink-2);font-size:14px}
.empty strong{display:block;color:var(--ink);font-size:16.5px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--violet);color:#fff;font-weight:500;padding:13px 18px;border-radius:12px;min-height:46px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:transparent;color:var(--ink-2);padding:10px 12px;min-height:auto}
.btn.sm{padding:9px 12px;min-height:38px;font-size:13.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
input[type=text],input[type=search],input[type=number],input[type=password],input[type=date],select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-height:46px;font-size:16px}
input::placeholder{color:#9AA79F}
label.fld{display:block;margin-bottom:14px}
label.fld > span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
label.fld > em{display:block;font-style:normal;font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.4}

.tools{display:flex;gap:8px;margin-bottom:11px}
.tools input{flex:1}
.tools select{width:auto;flex:none;padding-right:30px}
.chips{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink-2)}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.chip b{font-weight:600}
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}

/* generic row */
.r{display:flex;align-items:center;gap:11px;padding:11px 11px 11px 13px;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:none}
.r.going{opacity:0;transform:translateX(30px);transition:all .25s ease-in}
.r .body{flex:1;min-width:0}
.r .body b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-family:var(--mono);font-size:11px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.num{font-family:var(--mono);font-size:11px;color:var(--ink-2);width:17px;text-align:right;flex:none}
.tick{width:26px;height:26px;flex:none;border:2px solid var(--line);border-radius:50%;position:relative;background:#fff}
.tick:hover{border-color:var(--violet)}
.tick.on{background:var(--violet);border-color:var(--violet)}
.tick.on::after{content:"";position:absolute;inset:0;background:no-repeat center/13px url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>")}
.qty{font-family:var(--mono);font-size:12px;color:var(--ink-2);background:var(--paper);border-radius:7px;padding:3px 7px;flex:none;white-space:nowrap}
.kill{flex:none;width:31px;height:31px;border-radius:8px;color:#A9B4AC;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center}
.kill:hover{background:#0000000a;color:var(--red)}
.mini{width:35px;height:31px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:16px;line-height:1;color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex:none}
.mini.plus{border-color:var(--violet);color:var(--violet)}
.mini.on{background:var(--violet);color:#fff;border-color:var(--violet)}
.acts{display:flex;gap:6px;flex:none}

/* tags */
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;flex:none;white-space:nowrap}
.tag.exp-ok{background:var(--green-soft);color:var(--green)}
.tag.exp-soon{background:var(--amber-soft);color:var(--amber)}
.tag.exp-gone{background:var(--red-soft);color:var(--red)}
.tag.add-exp{background:transparent;color:var(--ink-2);border:1px dashed var(--line)}
.tag.place{background:var(--blue-soft);color:var(--blue)}
.tag.due{background:var(--violet-soft);color:var(--violet)}
.tag.soon{background:var(--amber-soft);color:var(--amber)}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.new{background:var(--paper);color:var(--ink-2)}
.tag.have{background:var(--green-soft);color:var(--green)}
.bar{height:4px;border-radius:3px;background:var(--paper);overflow:hidden;border:1px solid var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--green)}
.bar i.soon{background:var(--amber)} .bar i.gone{background:var(--red)} .bar i.due{background:var(--violet)}
.bar.unknown{background:repeating-linear-gradient(45deg,#fff,#fff 4px,var(--paper) 4px,var(--paper) 8px)}

/* thumbs */
.thumb{width:42px;height:42px;border-radius:11px;flex:none;object-fit:cover;background:var(--paper);border:1px solid var(--line)}
.thumb.big{width:64px;height:64px;border-radius:14px}
.mono-tile{width:42px;height:42px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;border:1px solid rgba(0,0,0,.06)}
.mono-tile.big{width:64px;height:64px;border-radius:14px;font-size:24px}
.thumb-wrap{position:relative;flex:none}
.thumb-wrap .cam{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-2);line-height:1}

.quickadd{display:flex;gap:8px;margin-bottom:14px}
.quickadd input{flex:1}
.quickadd .btn{flex:none;width:52px;padding:0;font-size:22px;font-weight:400}
.aisle{margin-bottom:16px}
.aisle h4{margin:0 0 7px;font-size:11px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;font-weight:500}

/* capture grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 13px;text-align:left;display:flex;flex-direction:column;gap:7px;min-height:120px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.cap:active{transform:translateY(1px)}
.cap svg{width:25px;height:25px;stroke:var(--violet);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cap b{font-weight:500;font-size:14.5px}
.cap small{color:var(--ink-2);font-size:12.5px;line-height:1.3}
.cap::after{content:"";position:absolute;right:-30px;top:-30px;width:78px;height:78px;border-radius:50%;background:var(--violet-soft);opacity:.55}
.cap > *{position:relative;z-index:1}
.cap.wide{grid-column:1 / -1;min-height:0;flex-direction:row;align-items:center;gap:13px}
.cap.wide .txt{display:flex;flex-direction:column;gap:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(22,33,28,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-radius:20px 20px 0 0;max-width:640px;margin:0 auto;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.8,.35,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translateY(0)}
.sheet-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sheet-body{padding:16px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-foot .btn{flex:1}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{padding:9px 6px;border-radius:9px;font-size:13px;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--violet);color:#fff}
.pick{display:flex;align-items:center;gap:11px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.pick input[type=checkbox]{width:22px;height:22px;accent-color:var(--violet);flex:none}
.pick .p-name{flex:1;min-width:0}
.pick .p-name b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .p-name small{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.pick input[type=text]{width:82px;flex:none;padding:8px 10px;min-height:38px;font-family:var(--mono);font-size:13px;text-align:center}
.selrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.quickdays{display:flex;gap:7px;flex-wrap:wrap;margin:-6px 0 14px}
.quickdays button{font-family:var(--mono);font-size:12px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink-2)}
.quickdays button.on{background:var(--violet);border-color:var(--violet);color:#fff}

#scanwrap{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}
#scanwrap video,#scanwrap canvas{width:100%;height:100%;object-fit:cover}
#reader{width:100%}
.reticle{position:absolute;inset:20% 10%;border:2px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.26);pointer-events:none}
.reticle::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--violet);animation:sweep 1.8s ease-in-out infinite}
@keyframes sweep{0%,100%{top:10%}50%{top:90%}}

.note{font-size:13px;color:var(--ink-2);line-height:1.45}
.thinking{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);padding:22px 4px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:var(--red-soft);border:1px solid #F1CFCC;color:var(--red);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45}
.ok-note{background:var(--green-soft);border:1px solid #C3DFD0;color:var(--green);border-radius:12px;padding:12px 14px;font-size:13.5px}
.shot{width:100%;max-height:150px;object-fit:cover;border-radius:12px;margin-bottom:14px;border:1px solid var(--line)}
.banner{background:var(--amber-soft);border:1px solid #EAD9B4;color:#6B4A02;border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:13px;line-height:1.45}
.banner button{text-decoration:underline;font-weight:500;color:inherit}
.split{display:flex;gap:10px}
.split > *{flex:1}
hr.sep{border:none;border-top:1px solid var(--line);margin:20px 0 16px}
.dropzone{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--ink-2);font-size:13.5px;background:#fff;line-height:1.5}
.dropzone.hot{border-color:var(--violet);background:var(--violet-soft)}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;z-index:60;display:flex;align-items:center;gap:14px;font-size:14px;max-width:calc(100% - 28px);opacity:0;pointer-events:none;transition:all .2s;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{color:#B9A8FF;font-weight:600;font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* three columns, like the sketch */
@media (min-width:1000px){
  main{padding:18px 16px 40px}
  .cols{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:18px;align-items:start}
  .pane{display:block!important;animation:none}
  .pane-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 11px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
  .pane-title h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
  .pane-title span{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em}
  nav{display:none}
  .grid2{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="head-row">
      <div class="wordmark">Restock <i id="hdrCount"></i></div>
      <button class="sync" id="syncBtn" aria-label="Sync now"><i class="dot off" id="syncDot"></i><span id="syncTxt">local</span></button>
      <button class="addbtn" id="addBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add</button>
      <button class="icon-btn" id="setBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div id="warnBox"></div>
    <div class="cols">

      <!-- ===== BOUGHT (history) ===== -->
      <section class="pane" id="p-bought">
        <div class="pane-title"><h2>Things I've bought</h2><span id="boughtNum"></span></div>
        <div class="tools">
          <input type="search" id="bqSearch" placeholder="Search what you buy…" autocomplete="off">
          <select id="bqSort" aria-label="Sort">
            <option value="recent">Most recent</option>
            <option value="due">Due first</option>
            <option value="often">Most bought</option>
            <option value="az">A–Z</option>
          </select>
        </div>
        <div id="boughtBody"></div>
      </section>

      <!-- ===== HAVE (home) ===== -->
      <section class="pane on" id="p-have">
        <div class="pane-title"><h2>Things I have</h2><span>by use-by date</span></div>
        <div class="chips" id="haveChips"></div>
        <div id="haveBody"></div>
      </section>

      <!-- ===== BUY ===== -->
      <section class="pane" id="p-buy">
        <div class="pane-title"><h2>Things to buy</h2><span id="buyNum"></span></div>
        <div class="quickadd">
          <input type="text" id="quickName" placeholder="banana 6, toor dal 1 kg…" list="knownItems" autocomplete="off" enterkeyhint="done">
          <datalist id="knownItems"></datalist>
          <button class="btn" id="quickAdd" aria-label="Add">+</button>
        </div>
        <div id="buyBody"></div>
      </section>

    </div>
  </main>

  <nav>
    <div class="nav-inner">
      <button class="tab on" data-pane="have">
        <svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 016.5 6h11A2.5 2.5 0 0120 8.5v9a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 014 17.5z"/><path d="M4 12h16M9 6V4.5M15 6V4.5M9.5 15.5h2"/></svg>
        <span>I have <i class="count" id="haveCount"></i></span>
      </button>

<script>
/* ==========================================================
   Restock — three stages:
     To buy  →(tick)→  Things I have  →(used up)→ gone
                    ↘ recorded forever in Things I've bought
   Local-first, optional private-gist sync, Gemini for photos.
   ========================================================== */

const LKEY = 'restock:data:v1';
const CKEY = 'restock:conf:v1';
const GIST_FILE = 'restock.json';
const DAY = 86400000;
const THUMB_PX = 112;

const CATS = [
  'Vegetables & fruit','Atta, rice & dal','Masala & spices','Oils & ghee','Dairy & eggs',
  'Bread & bakery','Meat & fish','Snacks & namkeen','Tea, coffee & drinks','Frozen & ready',
  'Cleaning & household','Personal care','Puja & sundries','Other'
];
const PLACES = ['Fridge','Freezer','Pantry','Elsewhere'];
const PLACE_OF = {
  'Vegetables & fruit':'Fridge','Dairy & eggs':'Fridge','Meat & fish':'Fridge','Frozen & ready':'Freezer',
  'Bread & bakery':'Pantry','Atta, rice & dal':'Pantry','Masala & spices':'Pantry','Oils & ghee':'Pantry',
  'Snacks & namkeen':'Pantry','Tea, coffee & drinks':'Pantry','Cleaning & household':'Elsewhere',
  'Personal care':'Elsewhere','Puja & sundries':'Elsewhere','Other':'Pantry'
};
const SHELF_HINT = {
  'Vegetables & fruit':6,'Dairy & eggs':5,'Meat & fish':2,'Bread & bakery':4,'Frozen & ready':90,
  'Atta, rice & dal':120,'Masala & spices':240,'Oils & ghee':150,'Snacks & namkeen':45,
  'Tea, coffee & drinks':120,'Cleaning & household':0,'Personal care':0,'Puja & sundries':0,'Other':0
};

const CAT_RULES = [
  ['Vegetables & fruit', /\b(aloo|potato|potatoes|pyaz|onion|tamatar|tomato|tomatoes|bhindi|okra|lauki|tori|karela|baingan|brinjal|eggplant|gobi|cauliflower|cabbage|matar|peas|gajar|carrot|shimla|capsicum|mirchi|chilli|chili|adrak|ginger|lehsun|garlic|dhania patta|coriander|pudina|mint|methi|palak|spinach|saag|kaddu|pumpkin|kheera|cucumber|nimbu|lemon|lime|kela|banana|bananas|seb|apple|angoor|grapes|santra|orange|aam|mango|papita|papaya|anar|pomegranate|nariyal|coconut|drumstick|curry leaves|kadi patta|sprouts|beans|mushroom|broccoli|avocado|berry|berries|watermelon|tarbooj|guava|amrood|chikoo|dragon fruit|sabzi|vegetable|vegetables|fruit|fruits)\b/],
  ['Atta, rice & dal', /\b(atta|maida|besan|suji|sooji|rava|rice|chawal|basmati|poha|daliya|dalia|ragi|bajra|jowar|quinoa|oats|dal|daal|toor|tur|arhar|moong|masoor|urad|chana|rajma|chhole|chole|lobia|sabudana|vermicelli|semiya|pasta|noodle|noodles|macaroni|flour|millet|idli rava|upma)\b/],
  ['Masala & spices', /\b(masala|haldi|turmeric|jeera|cumin|mirch|garam masala|hing|asafoetida|rai|sarson|mustard seed|methi dana|ajwain|elaichi|cardamom|laung|clove|dalchini|cinnamon|tej patta|bay leaf|kali mirch|pepper|saunf|fennel|kasuri|chaat masala|sambar|rasam|amchur|imli|tamarind|salt|namak|baking soda|baking powder|kesar|saffron|spice|gud|jaggery)\b/],
  ['Oils & ghee', /\b(oil|tel|ghee|butter|makhan|refined|coconut oil|sunflower|groundnut|sesame oil|olive oil|vanaspati|dalda)\b/],
  ['Dairy & eggs', /\b(milk|doodh|dahi|curd|yoghurt|yogurt|paneer|cheese|cheese slice|cream|malai|lassi|buttermilk|chaas|khoya|amul|egg|eggs|ande|anda)\b/],
  ['Bread & bakery', /\b(bread|pav|bun|roti|chapati|paratha|khakhra|rusk|toast|cake|pastry|biscuit|biscuits|cookie|croissant|tortilla|pita|naan|kulcha)\b/],
  ['Meat & fish', /\b(chicken|murgi|mutton|lamb|goat|keema|fish|machli|prawn|jhinga|shrimp|pomfret|rohu|surmai|crab|beef|pork|bacon|sausage|salami|tuna)\b/],
  ['Snacks & namkeen', /\b(namkeen|bhujia|sev|mixture|chips|kurkure|chocolate|toffee|candy|chikki|laddu|barfi|sweet|sweets|mithai|popcorn|nuts|badam|almond|kaju|cashew|akhrot|walnut|kishmish|raisin|pista|dates|khajur|makhana|peanut|peanuts|moongphali|papad|khari|granola)\b/],
  ['Tea, coffee & drinks', /\b(tea|chai|chai patti|green tea|coffee|bru|nescafe|horlicks|bournvita|boost|complan|juice|storia|soft drink|cola|pepsi|thums|sprite|soda|water|mineral water|energy drink|beer|wine|whisky|rum|kombucha|glucon|electral|ors)\b/],
  ['Frozen & ready', /\b(frozen|ice cream|kulfi|french fries|nuggets|ready to eat|instant|maggi|cup noodles|momos|batter|idli batter|dosa batter|frozen corn|sweet corn)\b/],
  ['Cleaning & household', /\b(detergent|surf|ariel|tide|rin|vim|dishwash|bartan|harpic|lizol|phenyl|colin|bleach|toilet cleaner|floor cleaner|scrub|sponge|jhadu|broom|pocha|mop|garbage bag|dustbin bag|trash bag|foil|cling|tissue|paper towel|napkin|matchbox|candle|battery|bulb|mosquito|all out|naphthalene|cylinder|water filter)\b/],
  ['Personal care', /\b(soap|sabun|shampoo|conditioner|toothpaste|colgate|toothbrush|floss|deodorant|deo|perfume|razor|blade|shaving|lotion|moisturis|sunscreen|talc|hair oil|sanitary|pad|whisper|stayfree|tampon|diaper|wipes|handwash|sanitizer|face wash|hair colour|mehendi|condom|dettol)\b/],
  ['Puja & sundries', /\b(agarbatti|incense|dhoop|camphor|kapoor|diya|batti|puja|pooja|kumkum|prasad|rakhi|kalava|matchstick)\b/]
];

const UNITS = 'kg|kgs|kilo|kilos|g|gm|gms|gram|grams|mg|l|ltr|litre|liter|litres|liters|ml|dozen|dz|pack|packs|packet|packets|pkt|pc|pcs|piece|pieces|nos|no|bunch|bunches|bottle|bottles|tin|tins|box|boxes|bag|bags';

let state = { have: [], buy: [], bought: [], tombs: [] };
let conf  = { geminiKey: '', geminiModel: 'gemini-2.5-flash', ghToken: '', gistId: '', useOFF: true };
let pushTimer = null, undoTimer = null, lastUndo = null, pushing = false, lastPushed = '';
let havePlace = 'All', pendingThumb = null, sizeWarned = false;

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 9) + now().toString(36).slice(-4);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const days = ms => Math.max(0, Math.round((now() - ms) / DAY));
const titled = s => String(s || '').replace(/\s+/g, ' ').trim().replace(/^./, c => c.toUpperCase());
const isoDate = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

/* ---------------- persistence + migration ---------------- */
function migrate(d){
  if (!d) return null;
  if (Array.isArray(d.have) && Array.isArray(d.buy) && Array.isArray(d.bought)) return d;
  /* older two-stage shape: { list, index } */
  if (Array.isArray(d.list) || Array.isArray(d.index)){
    const bought = (d.index || []).map(e => ({
      id: e.id || uid(), name: e.name, cat: e.cat || 'Other', thumb: e.thumb || '',
      count: e.count || 0, last: e.last || 0, gaps: e.gaps || [], codes: e.codes || [],
      shelf: e.shelf || 0, place: PLACE_OF[e.cat] || 'Pantry', mtime: e.mtime || now()
    }));
    const have = (d.index || []).filter(e => e.expiry).map(e => ({
      id: uid(), name: e.name, qty: '', place: PLACE_OF[e.cat] || 'Pantry',
      useBy: e.expiry, added: e.last || now(), mtime: now()
    }));
    return { have, buy: (d.list || []), bought, tombs: d.tombs || [] };
  }
  return null;
}
function loadLocal(){
  try {
    const raw = localStorage.getItem(LKEY);
    if (raw){
      const m = migrate(JSON.parse(raw));
      if (m) state = { have: m.have || [], buy: m.buy || [], bought: m.bought || [], tombs: m.tombs || [] };
    }
    const c = localStorage.getItem(CKEY);
    if (c) conf = Object.assign(conf, JSON.parse(c));
  } catch (e){ console.warn('load failed', e); }
}
function writeLocal(){
  try { localStorage.setItem(LKEY, JSON.stringify(state)); }
  catch (e){ toast('Storage is full — remove a few pictures'); }
}
function writeConf(){ try { localStorage.setItem(CKEY, JSON.stringify(conf)); } catch (e){} }
function blank(){ return { have: [], buy: [], bought: [], tombs: [] }; }

/* ---------------- merge ---------------- */
function mergeArrays(a, b, dead){
  const map = new Map();
  for (const it of [...(a||[]), ...(b||[])]){
    if (!it || !it.id) continue;
    const prev = map.get(it.id);
    if (!prev || (it.mtime || 0) > (prev.mtime || 0)) map.set(it.id, it);
  }
  return Array.from(map.values()).filter(it => !(dead.has(it.id) && dead.get(it.id) >= (it.mtime || 0)));
}
function mergeState(local, remote){
  remote = migrate(remote) || blank();
  const tombs = [...(local.tombs||[]), ...(remote.tombs||[])].filter(t => t && now() - t.t < 30 * DAY);
  const dead = new Map();
  for (const t of tombs) dead.set(t.id, Math.max(dead.get(t.id) || 0, t.t));
  return {
    have: mergeArrays(local.have, remote.have, dead),
    buy: mergeArrays(local.buy, remote.buy, dead),
    bought: mergeArrays(local.bought, remote.bought, dead),
    tombs: Array.from(dead, ([id, t]) => ({ id, t }))
  };
}

/* ---------------- gist sync ---------------- */
function gistReady(){ return !!(conf.ghToken && conf.gistId); }
async function gh(path, opts){
  const r = await fetch('https://api.github.com' + path, Object.assign({
    headers: { 'Authorization': 'Bearer ' + conf.ghToken, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' }
  }, opts || {}));
  if (!r.ok) throw new Error(
    r.status === 401 ? 'GitHub rejected the token. Check it still has gist access.'
    : r.status === 404 ? 'That gist ID was not found under this token.'
    : r.status === 422 ? 'GitHub refused the data — it may be too large. Remove some pictures.'
    : 'GitHub returned ' + r.status + '.');
  return r.json();
}
async function createGist(){
  const g = await gh('/gists', { method: 'POST', body: JSON.stringify({
    description: 'Restock — grocery data', public: false,
    files: { [GIST_FILE]: { content: JSON.stringify(state) } } })});
  conf.gistId = g.id; writeConf(); return g.id;
}
async function pull(quiet){
  if (!gistReady()){ setSync('off', 'local'); return; }
  if (!navigator.onLine){ setSync('warn', 'offline'); return; }
  setSync('busy', 'syncing');
  try {
    const g = await gh('/gists/' + conf.gistId);
    const f = g.files && g.files[GIST_FILE];
    let text = '';
    if (f) text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    const remote = text ? JSON.parse(text) : blank();
    const before = JSON.stringify(state);
    state = mergeState(state, remote);
    const after = JSON.stringify(state);
    if (before !== after){ writeLocal(); renderAll(); }
    lastPushed = JSON.stringify(migrate(remote) || blank());
    setSync('ok', 'synced');
    if (after !== lastPushed) queuePush();
  } catch (e){ setSync('err', 'sync error'); if (!quiet) toast(e.message); }
}
function queuePush(){ if (!gistReady()) return; clearTimeout(pushTimer); pushTimer = setTimeout(push, 1500); }
async function push(){
  if (!gistReady() || pushing) return;
  if (!navigator.onLine){ setSync('warn', 'offline'); return; }
  const payload = JSON.stringify(state);
  if (payload === lastPushed){ setSync('ok', 'synced'); return; }
  if (payload.length > 900000 && !sizeWarned){ sizeWarned = true; toast('Data is getting large — trim a few pictures'); }
  pushing = true; setSync('busy', 'saving');
  try { await gh('/gists/' + conf.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content: payload } } }) });
    lastPushed = payload; setSync('ok', 'synced');
  } catch (e){ setSync('err', 'sync error'); } finally { pushing = false; }
}
function setSync(kind, txt){
  $('#syncDot').className = 'dot' + (kind === 'ok' ? '' : ' ' + kind);
  $('#syncTxt').textContent = txt;
}

/* ---------------- quantities ---------------- */
function tidyQty(n0, unit){
  const n = String(n0).replace(/\s+/g, '');
  if (!unit) return n + ' pcs';
  let u = unit.toLowerCase();
  if (/^(kgs?|kilos?)$/.test(u)) u = 'kg';
  else if (/^(gm?s?|grams?)$/.test(u)) u = 'g';
  else if (/^(l|ltr|litres?|liters?)$/.test(u)) u = 'L';
  else if (/^ml$/.test(u)) u = 'ml';
  else if (/^(dozen|dz)$/.test(u)) u = 'dozen';
  else if (/^(pkt|packets?|packs?)$/.test(u)) u = 'pack';
  else if (/^(pcs?|pieces?|nos?)$/.test(u)) u = 'pcs';
  return n + ' ' + u;
}
function splitQty(line){
  let name = String(line || '').replace(/\s*\+\s*(\d)/g, ' $1').trim(), qty = '';
  if (!name) return null;
  let m;
  const U = '(' + UNITS + ')';
  const N = '((?:\\d+\\s*\\/\\s*\\d+|\\d+(?:[.,]\\d+)?))';
  if ((m = name.match(new RegExp('^(.*?)[\\s,]+' + N + '\\s*' + U + '\\.?$', 'i')))){ name = m[1]; qty = tidyQty(m[2], m[3]); }
  else if ((m = name.match(new RegExp('^' + N + '\\s*' + U + '\\.?[\\s,]+(.+)$', 'i')))){ qty = tidyQty(m[1], m[2]); name = m[3]; }
  else if ((m = name.match(/^(.*?)\s*[x×]\s*(\d+)$/i))){ name = m[1]; qty = tidyQty(m[2], null); }
  else if ((m = name.match(/^(.*?)[\s,]+(\d+)$/))){ name = m[1]; qty = tidyQty(m[2], null); }
  else if ((m = name.match(/^(\d+)\s+(\D.+)$/))){ qty = tidyQty(m[1], null); name = m[2]; }
  name = name.replace(/[,\-–—]+$/, '').trim();
  if (!name) return null;
  return { name: titled(name), qty };
}

/* ---------------- records ---------------- */
function guessCat(name){
  const n = ' ' + norm(name) + ' ';
  for (const [cat, re] of CAT_RULES) if (re.test(n)) return cat;
  return 'Other';
}
function findBought(name){ const n = norm(name); return state.bought.find(i => norm(i.name) === n); }
function findHave(name){ const n = norm(name); return state.have.find(i => norm(i.name) === n); }

function ensureBought(name, cat){
  let e = findBought(name);
  if (e) return e;
  const c = cat || guessCat(name);
  e = { id: uid(), name: titled(name), cat: c, thumb: '', count: 0, last: 0, gaps: [], codes: [],
        shelf: 0, place: PLACE_OF[c] || 'Pantry', mtime: now() };
  state.bought.push(e);
  return e;
}

function addToBuy(name, qty, cat){
  name = titled(name);
  if (!name) return null;
  const dupe = state.buy.find(i => norm(i.name) === norm(name));
  if (dupe){ dupe.qty = qty || dupe.qty; dupe.mtime = now(); return dupe; }
  const known = findBought(name);
  const item = { id: uid(), name: known ? known.name : name, qty: qty || '',
    cat: cat || (known && known.cat) || guessCat(name), added: now(), mtime: now() };
  state.buy.unshift(item);
  return item;
}

/* the whole point: buying moves it into the house and into the record */
function recordPurchase(name, qty, cat){
  const entry = ensureBought(name, cat);
  if (entry.last){
    const gap = Math.round((now() - entry.last) / DAY);
    if (gap >= 1){ entry.gaps.push(gap); entry.gaps = entry.gaps.slice(-8); }
  }
  entry.count = (entry.count || 0) + 1;
  entry.last = now();
  entry.mtime = now();

  const existing = findHave(entry.name);
  if (existing){
    existing.qty = qty || existing.qty;
    existing.added = now();
    if (entry.shelf > 0) existing.useBy = now() + entry.shelf * DAY;
    existing.mtime = now();
    return { entry, have: existing, madeHave: false };
  }
  const h = { id: uid(), name: entry.name, qty: qty || '', place: entry.place || PLACE_OF[entry.cat] || 'Pantry',
    useBy: entry.shelf > 0 ? now() + entry.shelf * DAY : 0, added: now(), mtime: now() };
  state.have.unshift(h);
  return { entry, have: h, madeHave: true };
}

function tickOffBuy(id){
  const i = state.buy.findIndex(x => x.id === id);
  if (i < 0) return;
  const item = state.buy[i];
  const before = findBought(item.name);
  const snap = { item: JSON.parse(JSON.stringify(item)), entry: before ? JSON.parse(JSON.stringify(before)) : null };
  const res = recordPurchase(item.name, item.qty, item.cat);
  snap.createdEntry = !before;
  snap.haveId = res.madeHave ? res.have.id : null;
  snap.haveBefore = res.madeHave ? null : JSON.parse(JSON.stringify(res.have));
  state.buy.splice(i, 1);
  state.tombs.push({ id: item.id, t: now() });
  lastUndo = { kind: 'buy', snap };
  save();
  const needsDate = !res.have.useBy && (SHELF_HINT[res.entry.cat] || 0) > 0 && (SHELF_HINT[res.entry.cat] || 0) <= 30;
  if (needsDate) toast(item.name + ' → I have', 'Use by', () => openUseBy(res.have.id));
  else toast(item.name + ' → I have', 'Undo', undoLast);
}

function undoLast(){
  if (!lastUndo || lastUndo.kind !== 'buy') return;
  const { item, entry, createdEntry, haveId, haveBefore } = lastUndo.snap;
  item.mtime = now();
  state.buy.unshift(item);
  state.tombs = state.tombs.filter(t => t.id !== item.id);
  if (haveId){ state.have = state.have.filter(h => h.id !== haveId); state.tombs.push({ id: haveId, t: now() }); }
  else if (haveBefore){ const cur = state.have.find(h => h.id === haveBefore.id); if (cur) Object.assign(cur, haveBefore, { mtime: now() }); }
  if (createdEntry) state.bought = state.bought.filter(b => norm(b.name) !== norm(item.name));
  else if (entry){ const cur = state.bought.find(b => b.id === entry.id); if (cur) Object.assign(cur, entry, { mtime: now() }); }
  lastUndo = null;
  save(); toast('Put back on the buy list');
}

function usedUp(id){
  const h = state.have.find(x => x.id === id);
  if (!h) return;
  state.have = state.have.filter(x => x.id !== id);
  state.tombs.push({ id, t: now() });
  save();
  toast(h.name + ' — used up');
}
function dropFromBuy(id){
  const item = state.buy.find(x => x.id === id);
  state.buy = state.buy.filter(x => x.id !== id);
  state.tombs.push({ id, t: now() });
  save();
  if (item) toast('Removed ' + item.name);
}
function dropFromBought(id){
  state.bought = state.bought.filter(x => x.id !== id);
  state.tombs.push({ id, t: now() });
  save(); toast('Removed from the record');
}

function rhythm(entry){
  if (!entry.gaps || !entry.gaps.length) return null;
  const g = [...entry.gaps].sort((a, b) => a - b);
  const m = Math.floor(g.length / 2);
  return g.length % 2 ? g[m] : Math.round((g[m - 1] + g[m]) / 2);
}
function dueState(entry){
  const avg = rhythm(entry), since = entry.last ? days(entry.last) : null;
  if (!avg || since == null) return { level: 'new', pct: 0, avg, since, label: since == null ? 'not bought yet' : 'bought once' };
  const ratio = since / avg, left = avg - since;
  if (ratio >= 1) return { level: 'due', pct: 100, avg, since, ratio, label: left === 0 ? 'due today' : Math.abs(left) + 'd overdue' };
  if (ratio >= .7) return { level: 'soon', pct: ratio * 100, avg, since, ratio, label: 'due in ' + left + 'd' };
  return { level: 'ok', pct: ratio * 100, avg, since, ratio, label: 'due in ' + left + 'd' };
}
function expState(h){
  if (!h.useBy) return null;
  const left = Math.ceil((h.useBy - now()) / DAY);
  const span = Math.max(1, Math.round((h.useBy - (h.added || h.useBy - 7 * DAY)) / DAY));
  const pct = Math.max(0, Math.min(100, (1 - left / span) * 100));
  if (left < 0) return { level: 'exp-gone', bar: 'gone', left, pct: 100, label: 'expired ' + Math.abs(left) + 'd ago' };
  if (left === 0) return { level: 'exp-gone', bar: 'gone', left, pct, label: 'use today' };
  if (left <= 2) return { level: 'exp-gone', bar: 'gone', left, pct, label: left + 'd left' };
  if (left <= 5) return { level: 'exp-soon', bar: 'soon', left, pct, label: left + 'd left' };
  return { level: 'exp-ok', bar: '', left, pct, label: left + 'd left' };
}

function save(){ writeLocal(); renderAll(); queuePush(); }

/* ---------------- thumbnails ---------------- */
function fileToDataURL(file){
  return new Promise((res, rej) => { const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => rej(new Error('That file could not be read.')); r.readAsDataURL(file); });
}
function loadImg(src){
  return new Promise((res, rej) => { const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => res(im); im.onerror = () => rej(new Error('That image could not be loaded.')); im.src = src; });
}
function squareThumb(img){
  const side = Math.min(img.width, img.height);
  const c = document.createElement('canvas');
  c.width = c.height = THUMB_PX;
  c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, THUMB_PX, THUMB_PX);
  return c.toDataURL('image/jpeg', 0.6);
}
async function thumbFromFile(file){ return squareThumb(await loadImg(await fileToDataURL(file))); }
async function thumbFromURL(url){ try { return squareThumb(await loadImg(url)); } catch (e){ return url; } }
function setThumb(entryId, thumb){
  const e = state.bought.find(x => x.id === entryId);
  if (!e) return;
  e.thumb = thumb; e.mtime = now(); save(); toast('Picture saved');
}
function monoColour(name){ let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360; return 'hsl(' + h + ' 34% 52%)'; }
function thumbHTML(nameOrEntry, big){
  const e = typeof nameOrEntry === 'string' ? findBought(nameOrEntry) : nameOrEntry;
  const nm = typeof nameOrEntry === 'string' ? nameOrEntry : (nameOrEntry ? nameOrEntry.name : '?');
  const cls = big ? ' big' : '';
  if (e && e.thumb) return '<img class="thumb' + cls + '" src="' + esc(e.thumb) + '" alt="" loading="lazy">';
  return '<div class="mono-tile' + cls + '" style="background:' + monoColour(nm) + '">' + esc(nm.trim().charAt(0).toUpperCase() || '?') + '</div>';
}

function renderBuy(){

  if (!n){
    body.innerHTML = '<div class="empty"><strong>Nothing to buy.</strong>Tap + on anything in your bought record, or type it above.</div>';
    return;
  }
  const groups = {};
  for (const it of state.buy) (groups[it.cat || 'Other'] ||= []).push(it);

    if (!items) continue;

function renderBought(){
  const total = state.bought.length;
  $('#boughtCount').textContent = total ? total : '';
  $('#boughtNum').textContent = total ? total + ' items' : '';
  const q = norm($('#bqSearch').value), sort = $('#bqSort').value;
  let items = state.bought.filter(i => !q || norm(i.name).includes(q));
  const rank = { due: 0, soon: 1, ok: 2, new: 3 };
  items.sort((a, b) => {
    if (sort === 'az') return a.name.localeCompare(b.name);
    if (sort === 'often') return (b.count || 0) - (a.count || 0);
    if (sort === 'due'){
      const A = dueState(a), B = dueState(b);
      if (rank[A.level] !== rank[B.level]) return rank[A.level] - rank[B.level];
      return (B.ratio || 0) - (A.ratio || 0);
    }
    return (b.last || 0) - (a.last || 0);            /* most recently bought first */
  });

  const body = $('#boughtBody');
  if (!total){
    body.innerHTML = '<div class="empty"><strong>No record yet.</strong>Everything you tick off the buy list is kept here for good, newest first.</div>';
    return;
  }
  if (!items.length){ body.innerHTML = '<div class="empty">Nothing matches that.</div>'; return; }

  const onBuy = new Set(state.buy.map(i => norm(i.name)));
  const inHouse = new Set(state.have.map(i => norm(i.name)));
  let html = '<div class="rows">';
  for (const it of items){
    const d = dueState(it);
    const queued = onBuy.has(norm(it.name));
    html += '<div class="r">'
      + '<button class="thumb-wrap" data-thumb="' + it.id + '" aria-label="Picture for ' + esc(it.name) + '">'
        + thumbHTML(it) + '<span class="cam">' + (it.thumb ? '&#9998;' : '+') + '</span></button>'
      + '<div class="body"><b>' + esc(it.name) + '</b>'
        + '<div class="meta">'
          + '<span>' + (it.last ? days(it.last) + 'd ago' : 'never') + '</span>'
          + '<span>' + (it.count || 0) + '&times;</span>'
          + (d.avg ? '<span>~' + d.avg + 'd</span>' : '')
          + (inHouse.has(norm(it.name)) ? '<span class="tag have">in stock</span>' : '<span class="tag ' + d.level + '">' + esc(d.label) + '</span>')
        + '</div>'
      + '</div>'
      + '<div class="acts">'
        + '<button class="mini" data-bedit="' + it.id + '" aria-label="Edit">&#8230;</button>'
        + '<button class="mini plus' + (queued ? ' on' : '') + '" data-queue="' + it.id + '" aria-label="Add to buy list">' + (queued ? '&#10003;' : '+') + '</button>'
      + '</div></div>';
  }
  body.innerHTML = html + '</div>';
}

/* ---------------- toast + sheet ---------------- */
function toast(msg, actLabel, fn){
  const t = $('#toast'), a = $('#toastAct');
  $('#toastMsg').textContent = msg;
  clearTimeout(undoTimer);
  if (actLabel){ a.hidden = false; a.textContent = actLabel; a.onclick = () => { t.classList.remove('on'); fn && fn(); }; }
  else a.hidden = true;
  t.classList.add('on');
  undoTimer = setTimeout(() => t.classList.remove('on'), actLabel ? 6000 : 2600);
}
let sheetCleanup = null;
function openSheet(title, bodyHTML, footHTML, cleanup){
  if (sheetCleanup && cleanup !== sheetCleanup){ try { sheetCleanup(); } catch(e){} sheetCleanup = null; }
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = bodyHTML;
  $('#sheetFoot').innerHTML = footHTML || '';
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  if (cleanup) sheetCleanup = cleanup;
}
function closeSheet(){
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on');
  pendingThumb = null;
  if (sheetCleanup){ try { sheetCleanup(); } catch(e){} sheetCleanup = null; }
  setTimeout(() => { if (!$('#sheet').classList.contains('on')) $('#sheetBody').innerHTML = ''; }, 300);
}

/* ---------------- vision ---------------- */
function shrink(file, max){
  return fileToDataURL(file).then(loadImg).then(img => {
    let w = img.width, h = img.height;
    const s = Math.min(1, max / Math.max(w, h));
    w = Math.round(w * s); h = Math.round(h * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    return c.toDataURL('image/jpeg', 0.82).split(',')[1];
  });
}
function visionPrompt(kind){
  const known = state.bought.slice().sort((a,b)=>(b.count||0)-(a.count||0)).slice(0,90).map(i => i.name);
  return 'This is a grocery capture from a shopper in India. It may be a product, a fridge or kitchen shelf, a handwritten or printed list, a kirana bill, a recipe, or a screenshot of a message.\n\n'
    + 'List every distinct grocery item in it.\n'
    + '- Use short everyday Indian shopping names ("toor dal", "curd", "atta"), not full pack titles. Keep a brand only when it is the identity of the thing.\n'
    + '- Skip prices, totals, GST, shop names and anything not a grocery item.\n'
    + '- qty: metric and short — "1 kg", "500 g", "1 L", "6 pcs", "1 dozen", or "" if not stated. A bare count of things is pieces.\n'
    + '- category must be exactly one of: ' + CATS.join(', ') + '.\n'
    + (known.length ? '- Reuse these existing names verbatim when the item matches one: ' + known.join(', ') + '.\n' : '')
    + (kind === 'barcode' ? '- The image is a product label or barcode. Identify the one product and return its barcode digits as "code" if legible.\n' : '')
    + '\nReturn JSON only: {"items":[{"name":"","qty":"","category":""' + (kind === 'barcode' ? ',"code":""' : '') + '}]}\n'
    + 'If nothing is readable, return {"items":[]}.';
}
async function askGemini(b64, kind){
  if (!conf.geminiKey) throw new Error('No Gemini key saved yet. Open settings and paste one — it is free from Google AI Studio.');
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/'
    + encodeURIComponent(conf.geminiModel || 'gemini-2.5-flash') + ':generateContent?key=' + encodeURIComponent(conf.geminiKey);
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [ { inline_data: { mime_type: 'image/jpeg', data: b64 } }, { text: visionPrompt(kind) } ] }],
      generationConfig: { temperature: 0.2, response_mime_type: 'application/json' } }) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok){
    const m = data && data.error && data.error.message ? data.error.message : 'Gemini returned ' + res.status;
    if (res.status === 400 && /API key/i.test(m)) throw new Error('That Gemini key was rejected. Check it in settings.');
    if (res.status === 429) throw new Error('Free-tier limit reached for now. Wait a minute, or type the items in.');
    if (res.status === 404) throw new Error('Model "' + conf.geminiModel + '" not found for this key. Try gemini-2.5-flash or gemini-2.0-flash.');
    throw new Error(m);
  }
  const cand = data.candidates && data.candidates[0];
  const text = cand && cand.content && cand.content.parts ? cand.content.parts.map(p => p.text || '').join('') : '';
  const clean = text.replace(/```json/gi, '').replace(/```/g, '').trim();
  const s = clean.indexOf('{'), e = clean.lastIndexOf('}');
  if (s < 0 || e < 0) throw new Error('Nothing readable came back. Try a closer, brighter shot.');
  const parsed = JSON.parse(clean.slice(s, e + 1));
  return Array.isArray(parsed.items) ? parsed.items : [];
}
async function readImage(file, kind, onDone){
  openSheet('Reading the image', '<div class="thinking"><i class="spin"></i>Opening the picture…</div>', '');
  let b64;
  try { b64 = await shrink(file, 1100); } catch (e){ return sheetError(e.message); }
  $('#sheetBody').innerHTML = '<img class="shot" src="data:image/jpeg;base64,' + b64 + '" alt="">'
    + '<div class="thinking"><i class="spin"></i>Working out what is in there…</div>';
  try {
    const items = await askGemini(b64, kind);
    if (onDone) return onDone(items, b64);
    showPicker(items, b64, file);
  } catch (e){ sheetError(e.message, () => readImage(file, kind, onDone)); }
}

let pickDest = 'buy';
function showPicker(items, b64, sourceFile){
  if (!items.length) return sheetError('No items found in that image. A closer, brighter shot usually does it.');
  pickDest = 'buy';
  const single = items.length === 1;
  let html = (b64 ? '<img class="shot" src="data:image/jpeg;base64,' + b64 + '" alt="">' : '')
    + '<p class="eyebrow">Where do these go?</p>'
    + '<div class="seg" id="destSeg">'
      + '<button data-dest="buy" class="on">To buy</button>'
      + '<button data-dest="have">I have it</button>'
      + '<button data-dest="record">Record only</button>'
    + '</div>'
    + '<div class="selrow"><p class="eyebrow" style="margin:0">Found ' + items.length + '</p><button class="btn quiet" id="selAll">Untick all</button></div>';
  items.forEach((it, i) => {
    const cat = CATS.includes(it.category) ? it.category : guessCat(it.name);
    html += '<label class="pick"><input type="checkbox" checked data-i="' + i + '">'
      + '<span class="p-name"><b>' + esc(titled(it.name) || 'Item') + '</b><small>' + esc(cat) + '</small></span>'
      + '<input type="text" value="' + esc(it.qty || '') + '" placeholder="qty" data-q="' + i + '"></label>';
  });
  if (single && b64) html += '<label class="pick" style="margin-top:12px"><input type="checkbox" id="useThumb" checked>'
    + '<span class="p-name"><b>Use this photo as its picture</b><small>112px, about 3 KB</small></span></label>';

  openSheet('Confirm', html, '<button class="btn ghost" id="pickCancel">Cancel</button><button class="btn" id="pickGo">Add</button>');

  $('#destSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-dest]');
    if (!b) return;
    pickDest = b.dataset.dest;
    $$('#destSeg button').forEach(x => x.classList.toggle('on', x === b));
  });
  let allOn = true;
  $('#selAll').onclick = () => {
    allOn = !allOn;
    $$('#sheetBody input[type=checkbox][data-i]').forEach(cb => cb.checked = allOn);
    $('#selAll').textContent = allOn ? 'Untick all' : 'Tick all';
  };
  $('#pickCancel').onclick = closeSheet;
  $('#pickGo').onclick = async () => {
    const chosen = [];
    $$('#sheetBody input[type=checkbox][data-i]').forEach(cb => {
      if (!cb.checked) return;
      const i = +cb.dataset.i;
      const q = $('#sheetBody input[data-q="' + i + '"]');
      const it = items[i];
      chosen.push({ name: titled(it.name), qty: q ? q.value.trim() : '', cat: CATS.includes(it.category) ? it.category : guessCat(it.name) });
    });
    if (!chosen.length) return closeSheet();
    chosen.forEach(c => {
      if (pickDest === 'buy'){ ensureBought(c.name, c.cat); addToBuy(c.name, c.qty, c.cat); }
      else if (pickDest === 'have') recordPurchase(c.name, c.qty, c.cat);
      else ensureBought(c.name, c.cat);
    });
    const keepThumb = single && $('#useThumb') && $('#useThumb').checked && sourceFile;
    save(); closeSheet();
    showPane(pickDest === 'buy' ? 'buy' : pickDest === 'have' ? 'have' : 'bought');
    toast(chosen.length + (chosen.length === 1 ? ' item added' : ' items added'));
    if (keepThumb){
      try { const t = await thumbFromFile(sourceFile); const e = findBought(chosen[0].name);
        if (e){ e.thumb = t; e.mtime = now(); writeLocal(); renderAll(); queuePush(); } } catch (err){}
    }
  };
}

function openThumbPicker(entryId){
  const e = state.bought.find(x => x.id === entryId);
  if (!e) return;
  pendingThumb = { entryId };
  openSheet('Picture for ' + e.name,
    '<div style="display:flex;gap:14px;align-items:center;margin-bottom:16px">' + thumbHTML(e, true)
    + '<div class="note">A 112px square, roughly 3 KB. It syncs with everything else.</div></div>'
    + '<div class="split" style="margin-bottom:10px"><button class="btn ghost sm" id="tCam">Take a photo</button><button class="btn ghost sm" id="tFile">Choose a file</button></div>'
    + '<div class="split" style="margin-bottom:14px"><button class="btn ghost sm" id="tSearch">Search the web</button><button class="btn ghost sm" id="tClip">Paste from clipboard</button></div>'
    + '<div class="dropzone" id="tDrop">Or paste here — copy any image, then <b>Ctrl/⌘ V</b>. Dragging one in works too.</div>'
    + '<label class="fld" style="margin-top:14px"><span>Or an image link</span><input type="text" id="tURL" placeholder="https://…" autocomplete="off"></label>'
    + '<div id="tMsg"></div>',
    (e.thumb ? '<button class="btn ghost" id="tDel">Remove picture</button>' : '') + '<button class="btn" id="tDone">Done</button>');
  $('#tDone').onclick = closeSheet;
  if ($('#tDel')) $('#tDel').onclick = () => { e.thumb = ''; e.mtime = now(); save(); closeSheet(); toast('Picture removed'); };
  $('#tCam').onclick = () => { $('#inThumb').setAttribute('capture', 'environment'); $('#inThumb').click(); };
  $('#tFile').onclick = () => { $('#inThumb').removeAttribute('capture'); $('#inThumb').click(); };
  $('#tSearch').onclick = () => {
    window.open('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(e.name), '_blank', 'noopener');
    $('#tMsg').innerHTML = '<div class="ok-note" style="margin-top:12px">Long-press a picture there → <b>Copy image</b>, come back, and paste it in.</div>';
  };
  $('#tClip').onclick = async () => {
    try {
      if (!navigator.clipboard || !navigator.clipboard.read) throw new Error('This browser will not hand over the clipboard. Use Ctrl/⌘ V on the box instead.');
      const items = await navigator.clipboard.read();
      for (const item of items){
        const type = item.types.find(t => t.startsWith('image/'));
        if (type){ const blob = await item.getType(type); setThumb(entryId, await thumbFromFile(blob)); closeSheet(); return; }
      }
      throw new Error('No picture found on the clipboard.');
    } catch (err){ $('#tMsg').innerHTML = '<div class="err" style="margin-top:12px">' + esc(err.message) + '</div>'; }
  };
  $('#tURL').addEventListener('change', async ev => {
    const v = ev.target.value.trim();

    $('#tMsg').innerHTML = '<div class="thinking"><i class="spin"></i>Fetching…</div>';
    setThumb(entryId, await thumbFromURL(v)); closeSheet();
  });
  const dz = $('#tDrop');
  ['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e2 => { e2.preventDefault(); dz.classList.add('hot'); }));
  ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e2 => { e2.preventDefault(); dz.classList.remove('hot'); }));
  dz.addEventListener('drop', async e2 => {
    const f = e2.dataTransfer.files && e2.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')){ setThumb(entryId, await thumbFromFile(f)); closeSheet(); return; }
    const txt = e2.dataTransfer.getData('text/uri-list') || e2.dataTransfer.getData('text/plain');
    if (txt && /^https?:\/\//i.test(txt.trim())){ setThumb(entryId, await thumbFromURL(txt.trim())); closeSheet(); }
  });
}

document.addEventListener('paste', async e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  let file = null;
  for (const it of items) if (it.type && it.type.startsWith('image/')) file = it.getAsFile();
  if (!file){
    if (pendingThumb){
      const txt = e.clipboardData.getData('text');
      if (txt && /^https?:\/\//i.test(txt.trim())){ e.preventDefault(); const id = pendingThumb.entryId;
        setThumb(id, await thumbFromURL(txt.trim())); closeSheet(); }
    }
    return;
  }
  e.preventDefault();
  if (pendingThumb){ const id = pendingThumb.entryId; setThumb(id, await thumbFromFile(file)); closeSheet(); return; }
  readImage(file, 'photo');
});

/* ---------------- barcode ---------------- */
let scanStop = null;
function stopScan(){ if (scanStop){ try { scanStop(); } catch(e){} scanStop = null; } }
function loadScript(src){
  return new Promise((res, rej) => {
    if (document.querySelector('script[data-src="' + src + '"]')) return res();
    const s = document.createElement('script'); s.src = src; s.dataset.src = src;
    s.onload = () => res(); s.onerror = () => rej(new Error('Scanner library could not load. Photograph the label instead.'));
    document.head.appendChild(s);
  });
}
async function startScan(){
  openSheet('Scan a barcode',
    '<div id="scanwrap"><video id="scanvid" playsinline muted></video><div class="reticle"></div></div>'
    + '<p class="note" style="margin-top:12px">Only packaged goods carry these. For loose vegetables, photographing the item works far better.</p>',
    '<button class="btn ghost" id="scanPhoto">Photograph it</button><button class="btn ghost" id="scanManual">Enter digits</button>', stopScan);
  $('#scanPhoto').onclick = () => { stopScan(); const i = $('#inCamera'); i.dataset.kind = 'barcode'; i.click(); };
  $('#scanManual').onclick = () => { stopScan(); manualCode(); };
  if ('BarcodeDetector' in window){ try { return await nativeScan(); } catch (e){} }
  await fallbackScan();
}
async function nativeScan(){
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } }); }
  catch (e){ return sheetError('The camera was blocked. Allow camera access for this site, or photograph the label instead.'); }
  const vid = $('#scanvid');
  if (!vid){ stream.getTracks().forEach(t => t.stop()); return; }
  vid.srcObject = stream; await vid.play().catch(() => {});
  let detector;
  try { detector = new window.BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'] }); }
  catch (e){ detector = new window.BarcodeDetector(); }
  let alive = true;
  scanStop = () => { alive = false; stream.getTracks().forEach(t => t.stop()); };
  const tick = async () => {
    if (!alive || !document.body.contains(vid)) return;
    try { const codes = await detector.detect(vid);
      if (codes && codes.length && codes[0].rawValue){ stopScan(); return onCode(String(codes[0].rawValue)); } } catch (e){}
    setTimeout(tick, 200);
  };
  tick();
}
async function fallbackScan(){
  const wrap = $('#scanwrap');
  if (!wrap) return;
  wrap.innerHTML = '<div id="reader"></div>';
  try { await loadScript('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'); }
  catch (e){ return sheetError(e.message); }
  if (!window.Html5Qrcode) return sheetError('Scanner library did not start. Photograph the label instead.');
  const h = new window.Html5Qrcode('reader', { verbose: false });
  let done = false;
  scanStop = () => { try { h.stop().then(() => h.clear()).catch(() => {}); } catch(e){} };
  try {
    await h.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 160 } },
      txt => { if (done) return; done = true; stopScan(); onCode(String(txt)); }, () => {});
  } catch (e){ sheetError('The camera was blocked or busy. Allow camera access, or photograph the label instead.'); }
}
function manualCode(){
  openSheet('Enter the digits',
    '<label class="fld"><span>Barcode number</span><input type="text" id="mcode" inputmode="numeric" placeholder="8901058000108"></label>',
    '<button class="btn ghost" id="mcancel">Cancel</button><button class="btn" id="mok">Look it up</button>');
  $('#mcancel').onclick = closeSheet;
  $('#mok').onclick = () => { const v = $('#mcode').value.trim(); if (v) onCode(v); };
  setTimeout(() => { const el = $('#mcode'); if (el) el.focus(); }, 250);
}
async function lookupOFF(code){
  if (!conf.useOFF || !navigator.onLine) return null;
  try {
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code)
      + '.json?fields=product_name,product_name_en,generic_name,brands,quantity,categories_tags,image_front_small_url');
    if (!r.ok) return null;
    const j = await r.json();
    if (!j || j.status !== 1 || !j.product) return null;
    const p = j.product;
    let name = (p.product_name_en || p.product_name || p.generic_name || '').trim();
    if (!name && p.brands) name = String(p.brands).split(',')[0].trim();
    if (!name) return null;
    if (name.length > 42) name = name.slice(0, 42).trim();
    return { name: titled(name), qty: (p.quantity || '').trim(), tags: p.categories_tags || [], img: p.image_front_small_url || '' };
  } catch (e){ return null; }
}
function catFromTags(tags, name){
  const t = (tags || []).join(' ');
  if (/dairy|milk|cheese|yogurt|curd|paneer|butter/i.test(t)) return 'Dairy & eggs';
  if (/beverage|drink|water|juice|tea|coffee/i.test(t)) return 'Tea, coffee & drinks';
  if (/snack|biscuit|chocolate|confection|chips|namkeen/i.test(t)) return 'Snacks & namkeen';
  if (/cereal|flour|rice|pulse|legume|pasta|noodle/i.test(t)) return 'Atta, rice & dal';
  if (/spice|condiment|masala|seasoning/i.test(t)) return 'Masala & spices';
  if (/oil|fat|ghee/i.test(t)) return 'Oils & ghee';
  if (/frozen|ready|meal/i.test(t)) return 'Frozen & ready';
  if (/bread|bakery/i.test(t)) return 'Bread & bakery';
  if (/meat|fish|seafood|poultry/i.test(t)) return 'Meat & fish';
  return guessCat(name);
}
async function onCode(code){
  const hit = state.bought.find(i => (i.codes || []).includes(code));
  if (hit){ addToBuy(hit.name, '', hit.cat); save(); closeSheet(); showPane('buy'); return toast('Added ' + hit.name + ' to the buy list'); }
  openSheet('Barcode ' + code, '<div class="thinking"><i class="spin"></i>Looking it up…</div>', '');
  const found = await lookupOFF(code);
  const cat = found ? catFromTags(found.tags, found.name) : 'Other';
  openSheet(found ? 'Found it' : 'New barcode',
    '<p class="eyebrow">Code</p><p style="font-family:var(--mono);font-size:15px;margin:0 0 16px">' + esc(code) + '</p>'
    + (found ? '<div class="ok-note" style="margin-bottom:14px">Open Food Facts knows this one. Rename it to whatever you call it.</div>' : '')
    + '<label class="fld"><span>What is it?</span><input type="text" id="bname" list="knownItems" value="' + esc(found ? found.name : '') + '" placeholder="e.g. toor dal" autocomplete="off"></label>'
    + '<label class="fld"><span>Quantity</span><input type="text" id="bqty" value="' + esc(found ? found.qty : '') + '" placeholder="1 kg"></label>'
    + '<label class="fld"><span>Aisle</span><select id="bcat">' + CATS.map(c => '<option' + (c === cat ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></label>',
    '<button class="btn ghost" id="bhave">I have it</button><button class="btn" id="bbuy">To buy list</button>');
  setTimeout(() => { const el = $('#bname'); if (el && !found) el.focus(); }, 250);
  const finish = async (dest) => {
    const name = titled($('#bname').value);
    if (!name){ $('#bname').focus(); return; }
    const c = $('#bcat').value, qty = $('#bqty').value.trim();
    const entry = ensureBought(name, c);
    entry.codes = Array.from(new Set([...(entry.codes || []), String(code)]));
    entry.cat = c; entry.mtime = now();
    if (dest === 'have') recordPurchase(name, qty, c); else addToBuy(name, qty, c);
    save(); closeSheet(); showPane(dest === 'have' ? 'have' : 'buy');
    toast(name + ' — barcode saved');
    if (found && found.img && !entry.thumb){
      const t = await thumbFromURL(found.img);
      const live = state.bought.find(x => x.id === entry.id);
      if (live){ live.thumb = t; live.mtime = now(); writeLocal(); renderAll(); queuePush(); }
    }
  };
  $('#bbuy').onclick = () => finish('buy');
  $('#bhave').onclick = () => finish('have');
}

/* ---------------- backup ---------------- */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'restock-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Backup downloaded');
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const incoming = migrate(JSON.parse(r.result));
      if (!incoming) throw new Error('bad file');
      state = mergeState(state, incoming); save(); toast('Backup merged in');
    } catch (e){ toast('That file is not a Restock backup'); }
  };
  r.readAsText(file);
}

  if (!el.value.trim()) return el.focus();
  const p = splitQty(el.value.trim());
  if (p){ ensureBought(p.name); addToBuy(p.name, p.qty); }
  el.value = ''; save(); el.focus();
};
$('#quickName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#quickAdd').click(); });

$('#buyBody').addEventListener('click', e => {
  const tk = e.target.closest('[data-tick]');
  if (tk){
    tk.classList.add('on');
    tk.closest('.r').classList.add('going');
    const id = tk.dataset.tick;
    setTimeout(() => tickOffBuy(id), 240);
    return;
  }
  const del = e.target.closest('[data-buydel]');
  if (del) dropFromBuy(del.dataset.buydel);
});

$('#haveBody').addEventListener('click', e => {
  const ub = e.target.closest('[data-useby]');
  if (ub) return openUseBy(ub.dataset.useby);
  const ed = e.target.closest('[data-hedit]');
  if (ed) return editHave(ed.dataset.hedit);
  const th = e.target.closest('[data-hthumb]');
  if (th){ const en = ensureBought(th.dataset.hthumb); writeLocal(); return openThumbPicker(en.id); }
  const up = e.target.closest('[data-used]');
  if (up){
    up.closest('.r').classList.add('going');
    const id = up.dataset.used;
    setTimeout(() => usedUp(id), 240);
  }
});
$('#haveChips').addEventListener('click', e => {
  const c = e.target.closest('[data-place]');
  if (!c) return;
  havePlace = c.dataset.place; renderHave();
});

$('#boughtBody').addEventListener('click', e => {
  const th = e.target.closest('[data-thumb]');
  if (th) return openThumbPicker(th.dataset.thumb);
  const ed = e.target.closest('[data-bedit]');
  if (ed) return editBought(ed.dataset.bedit);
  const tb = e.target.closest('[data-queue]');
  if (tb){
    const it = state.bought.find(x => x.id === tb.dataset.queue);
    if (!it) return;
    if (state.buy.some(l => norm(l.name) === norm(it.name))){
      state.buy.filter(l => norm(l.name) === norm(it.name)).forEach(g => state.tombs.push({ id: g.id, t: now() }));
      state.buy = state.buy.filter(l => norm(l.name) !== norm(it.name));
      save(); return toast('Taken off the buy list');
    }
    addToBuy(it.name, '', it.cat); save(); toast('Added ' + it.name + ' to the buy list');
  }
});
$('#bqSearch').addEventListener('input', renderBought);
$('#bqSort').addEventListener('change', renderBought);
document.addEventListener('click', e => { if (e.target.closest('[data-open-settings]')) openSettings(); });

function handleFile(input){
  const file = input.files && input.files[0];
  const kind = input.dataset.kind || 'photo';
  const pendingCode = input.dataset.code;
  input.value = '';
  delete input.dataset.code;
  if (!file) return;
  if (kind === 'barcode'){
    readImage(file, 'barcode', async (items) => {
      if (!items.length) return sheetError('That label could not be read. Try filling the frame with it.');
      const it = items[0];
      const code = pendingCode || it.code || '';
      const cat = CATS.includes(it.category) ? it.category : guessCat(it.name);
      const entry = ensureBought(titled(it.name), cat);
      if (code) entry.codes = Array.from(new Set([...(entry.codes || []), String(code)]));
      entry.mtime = now();
      addToBuy(entry.name, it.qty || '', cat);
      if (!entry.thumb){ try { entry.thumb = await thumbFromFile(file); } catch (e){} }
      save(); closeSheet(); showPane('buy');
      toast(entry.name + ' added' + (code ? ' — barcode saved' : ''));
    });
    return;
  }
  readImage(file, 'photo');
}
$('#inCamera').addEventListener('change', () => handleFile($('#inCamera')));
$('#inPhoto').addEventListener('change', () => { $('#inPhoto').dataset.kind = 'photo'; handleFile($('#inPhoto')); });
$('#inThumb').addEventListener('change', async () => {
  const f = $('#inThumb').files && $('#inThumb').files[0];
  $('#inThumb').value = '';
  if (!f || !pendingThumb) return;
  const id = pendingThumb.entryId;
  try { setThumb(id, await thumbFromFile(f)); closeSheet(); } catch (e){ toast('That picture could not be used'); }
});

const fi = document.createElement('input');
fi.type = 'file'; fi.accept = 'application/json,.json'; fi.id = 'fileImport'; fi.hidden = true;
document.body.appendChild(fi);
fi.addEventListener('change', e => { const f = e.target.files[0]; if (f) importData(f); e.target.value = ''; });

document.addEventListener('visibilitychange', () => { if (!document.hidden){ pull(true); renderHave(); } });
window.addEventListener('focus', () => pull(true));
window.addEventListener('online', () => pull(true));
window.addEventListener('offline', () => setSync('warn', 'offline'));

/* ---------------- boot ---------------- */
(function boot(){
  loadLocal();
  renderAll();
  if (gistReady()) pull(true); else setSync('off', 'local');
  setInterval(() => { if (!document.hidden && gistReady()) pull(true); }, 30000);
  setInterval(() => { renderHave(); renderBought(); }, 3600000);
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
